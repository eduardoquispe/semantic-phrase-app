services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: flow
      POSTGRES_PASSWORD: flow
      POSTGRES_DB: semantic_flow_test
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flow -d semantic_flow_test"]
      interval: 2s
      timeout: 2s
      retries: 15
